apis:
- aid: lemonflow-ai:chat-widget
  name: Lemonflow Chat Widget
  description: Embeddable AI chat surface for EV charging driver support. Ships as
    a lemonflow-chat custom element loaded from a single script tag, or as a headless
    iframe at /embed for teams that already operate their own chat chrome. Both paths
    share one backend, one agent and one set of lifecycle events. The widget is configured
    declaratively through element attributes (or snake_case URL query parameters on
    the iframe) and driven at runtime through a window.postMessage command/event API
    covering show/hide/reset/state-update, message injection and transcript retrieval.
  humanURL: https://lemonflow-ai.github.io/lemonflow-docs/protected/integration/widget-integration.html
  baseURL: https://chat.lemonflow.ai
