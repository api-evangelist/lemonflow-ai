aid: lemonflow-ai
name: Lemonflow
description: Lemonflow Technologies GmbH is a Munich-based company building AI agents
  purpose-built for the electric-vehicle charging industry. Its platform gives charge
  point operators (CPOs), eMobility service providers and charging software vendors
  24/7 AI-driven driver support across voice, chat and email in 30+ languages, plus
  an Operations Hub for proactive network monitoring, OCPP log interpretation, anomaly
  detection and self-healing automations such as remote charger resets. The developer-facing
  surface is an embeddable Chat Widget - a lemonflow-chat web component (and an equivalent
  headless iframe) loaded from chat.lemonflow.ai and driven through a postMessage
  command/event API - together with a documented set of CPMS integration requirements
  covering bulk station data, real-time status, OCPP logs, remote actions and ticketing.
  Lemonflow is backed by Speedinvest.
